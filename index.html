<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mansi Pundir</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,600&family=Jost:wght@200;300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    /* ══════════════════════════════════════════
       RESET & TOKENS
    ══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --g1: #C47F00;  /* deep burnished gold  */
      --g2: #E8A020;  /* warm amber            */
      --g3: #F5C842;  /* bright sun gold       */
      --g4: #FFE49A;  /* soft glow             */
      --g5: #FFF8E7;  /* ivory cream bg        */
      --dark: #1A1000;
      --mid:  #4A3000;
      --text: #2C1A00;
      --nav-h: 64px;
    }

    html { scroll-behavior: smooth; font-size: 16px; }
    body { background: var(--g5); color: var(--text); overflow-x: hidden; font-family: 'Jost', sans-serif; }

    /* ══ SCROLLBAR ══ */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--g5); }
    ::-webkit-scrollbar-thumb { background: var(--g3); border-radius: 99px; }

    /* ══════════════════════════════════════════
       BACKGROUND LAYERS
    ══════════════════════════════════════════ */
    .page-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 55% 45% at 80% 10%, rgba(245,200,66,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 40% 50% at 10% 80%, rgba(232,160,32,0.12) 0%, transparent 55%),
        var(--g5);
    }
    .sunrays {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .sunrays::before {
      content: '';
      position: absolute; top: -20%; left: 50%; transform: translateX(-50%);
      width: 180%; height: 180%;
      background: conic-gradient(
        from 180deg at 50% 0%,
        rgba(245,200,66,0.07) 0deg,   rgba(255,248,231,0.02) 18deg,
        rgba(232,160,32,0.06) 36deg,  rgba(255,248,231,0.02) 54deg,
        rgba(245,200,66,0.05) 72deg,  rgba(255,228,154,0.02) 90deg,
        rgba(232,160,32,0.06) 108deg, rgba(255,248,231,0.02) 126deg,
        rgba(245,200,66,0.07) 144deg, rgba(255,228,154,0.02) 162deg,
        rgba(232,160,32,0.05) 180deg
      );
      animation: slowSpin 80s linear infinite;
    }
    @keyframes slowSpin { to { transform: translateX(-50%) rotate(360deg); } }

    /* ══════════════════════════════════════════
       NAV
    ══════════════════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--nav-h);
      background: rgba(255,248,231,0.85);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid rgba(245,200,66,0.22);
      display: flex; align-items: center;
      padding: 0 clamp(20px,5vw,80px);
      justify-content: space-between;
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(16px,1.8vw,20px);
      font-weight: 500; font-style: italic;
      color: var(--g1); display: flex; align-items: center; gap: 8px;
      text-decoration: none; flex-shrink: 0;
    }
    .nav-logo-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: linear-gradient(135deg,var(--g2),var(--g3));
      flex-shrink: 0;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(245,200,66,0.4); }
      50%      { box-shadow: 0 0 0 6px rgba(245,200,66,0); }
    }
    .nav-links { display: flex; gap: clamp(18px,2.5vw,40px); align-items: center; list-style: none; }
    .nav-links a {
      font-family: 'Jost', sans-serif;
      font-size: clamp(11px,1.1vw,12px); letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--mid); text-decoration: none; font-weight: 400;
      transition: color 0.2s; position: relative; padding-bottom: 2px;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: 0; left: 0;
      width: 0; height: 1px; background: var(--g2);
      transition: width 0.25s ease;
    }
    .nav-links a:hover { color: var(--g1); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.active { color: var(--g1); }
    .nav-links a.active::after { width: 100%; }

    /* hamburger */
    .nav-ham {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; padding: 4px; background: none; border: none;
    }
    .nav-ham span {
      display: block; width: 24px; height: 2px;
      background: var(--g1); border-radius: 2px;
      transition: transform 0.3s, opacity 0.3s;
    }
    .nav-ham.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-ham.open span:nth-child(2) { opacity: 0; }
    .nav-ham.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-menu {
      display: none; position: fixed;
      top: var(--nav-h); left: 0; right: 0;
      background: rgba(255,248,231,0.97);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(245,200,66,0.22);
      padding: 20px clamp(20px,5vw,80px);
      z-index: 99; flex-direction: column; gap: 4px;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-family: 'Jost', sans-serif;
      font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--mid); text-decoration: none; font-weight: 400;
      padding: 10px 0; border-bottom: 1px solid rgba(245,200,66,0.18);
      transition: color 0.2s;
    }
    .mobile-menu a:last-child { border-bottom: none; }
    .mobile-menu a:hover { color: var(--g1); }

    /* ══════════════════════════════════════════
       LAYOUT PRIMITIVES
    ══════════════════════════════════════════ */
    main { position: relative; z-index: 1; }

    /* Each section is self-contained — no cascade hacks */
    .section-wrap {
      padding: clamp(72px,10vh,130px) clamp(20px,5vw,80px);
      max-width: 1200px; margin: 0 auto;
    }

    .full-divider {
      width: calc(100% - clamp(40px,10vw,160px));
      max-width: 1120px; height: 1px;
      margin: 0 auto;
      background: linear-gradient(90deg, transparent, rgba(245,200,66,0.3), transparent);
    }

    /* section label + title */
    .sec-label {
      font-family: 'Jost', sans-serif; font-size: 10px;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--g2); font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: clamp(12px,2vh,20px);
    }
    .sec-label::before {
      content: ''; display: block; width: 28px; height: 1.5px;
      background: linear-gradient(90deg,var(--g2),var(--g3));
    }
    .sec-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(30px,5vw,62px); font-weight: 400;
      color: var(--dark); line-height: 1.05;
      margin-bottom: clamp(10px,1.5vh,16px);
    }
    .sec-title em {
      font-style: italic;
      background: linear-gradient(135deg,var(--g1),var(--g2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .sec-sub {
      font-family: 'Jost', sans-serif; font-size: clamp(14px,1.3vw,16px);
      color: var(--mid); font-weight: 300; line-height: 1.75;
      max-width: 580px; margin-bottom: clamp(32px,5vh,56px);
    }

    /* ══ Fade-in ══ */
    .fade-in {
      opacity: 0; transform: translateY(18px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    /* ══════════════════════════════════════════
       BUTTONS
    ══════════════════════════════════════════ */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg,var(--g1),var(--g2));
      color: white; text-decoration: none;
      font-family: 'Jost', sans-serif; font-size: clamp(12px,1.2vw,14px);
      font-weight: 400; letter-spacing: 0.06em;
      padding: clamp(10px,1.2vw,14px) clamp(22px,2.5vw,32px);
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(196,127,0,0.28);
      transition: transform 0.2s, box-shadow 0.2s;
      border: none; cursor: pointer;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(196,127,0,0.38); }
    .btn-outline {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; border: 1.5px solid rgba(196,127,0,0.45);
      color: var(--g1); text-decoration: none;
      font-family: 'Jost', sans-serif; font-size: clamp(12px,1.2vw,14px);
      font-weight: 400; letter-spacing: 0.06em;
      padding: clamp(10px,1.2vw,14px) clamp(22px,2.5vw,32px);
      border-radius: 999px; cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .btn-outline:hover { background: rgba(245,200,66,0.1); border-color: var(--g1); transform: translateY(-2px); }

    /* ══════════════════════════════════════════
       HERO
    ══════════════════════════════════════════ */
    #home {
      min-height: 100vh;
      padding: calc(var(--nav-h) + clamp(48px,9vh,110px)) clamp(20px,5vw,80px) clamp(60px,8vh,100px);
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center;
    }
    .hero-inner {
      display: grid; grid-template-columns: 1fr auto;
      gap: clamp(32px,5vw,80px);
      align-items: center; width: 100%;
    }
    .hero-status {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(245,200,66,0.13);
      border: 1px solid rgba(245,200,66,0.38);
      border-radius: 999px; padding: 6px 16px;
      font-family: 'Jost', sans-serif;
      font-size: clamp(10px,1vw,12px); letter-spacing: 0.08em;
      color: var(--g1); font-weight: 400;
      margin-bottom: clamp(16px,2.5vh,28px); width: fit-content;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--g2);
      animation: blink 2.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

    .hero-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(46px,8.5vw,100px); font-weight: 400;
      color: var(--dark); line-height: 0.93; letter-spacing: -0.02em;
      margin-bottom: clamp(14px,2vh,22px);
    }
    .hero-name em {
      font-style: italic;
      background: linear-gradient(160deg,var(--g1) 0%,var(--g2) 45%,var(--g3) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-role {
      font-family: 'Playfair Display', serif;
      font-size: clamp(14px,1.8vw,20px); font-style: italic;
      color: var(--g1); margin-bottom: clamp(8px,1.2vh,14px);
    }
    .hero-desc {
      font-family: 'Jost', sans-serif;
      font-size: clamp(13px,1.3vw,16px); font-weight: 300;
      color: var(--mid); line-height: 1.8;
      max-width: 500px; margin-bottom: clamp(22px,3vh,34px);
    }
    .hero-meta {
      display: flex; gap: 22px; flex-wrap: wrap;
      margin-bottom: clamp(26px,3.5vh,42px);
    }
    .hero-meta-item {
      display: flex; align-items: center; gap: 6px;
      font-family: 'Jost', sans-serif; font-size: 13px;
      color: var(--mid); font-weight: 300;
    }
    .hero-meta-item span { color: var(--g2); font-size: 14px; }
    .hero-btns { display: flex; gap: 12px; flex-wrap: wrap; }
    .hero-socials { display: flex; gap: 12px; margin-top: clamp(26px,3.5vh,42px); }
    .social-icon {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1.5px solid rgba(196,127,0,0.28);
      display: flex; align-items: center; justify-content: center;
      color: var(--g1); font-size: 15px; text-decoration: none;
      transition: background 0.2s, border-color 0.2s, transform 0.2s; cursor: pointer;
    }
    .social-icon:hover { background: rgba(245,200,66,0.15); border-color: var(--g2); transform: translateY(-3px); }

    /* photo */
    .hero-photo-wrap { position: relative; flex-shrink: 0; }
    .photo-placeholder {
      width: clamp(200px,28vw,360px); height: clamp(240px,34vw,440px);
      border-radius: 22px;
      background: linear-gradient(160deg,rgba(245,200,66,0.12),rgba(255,228,154,0.22));
      border: 2px dashed rgba(245,200,66,0.4);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
    }
    .photo-placeholder span { font-size: 40px; }
    .photo-placeholder p {
      font-family: 'Jost', sans-serif; font-size: 11px;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--g1); opacity: 0.65; text-align: center; padding: 0 24px;
    }
    .hero-photo-badge {
      position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg,var(--g1),var(--g2));
      color: white; border-radius: 999px; padding: 7px 20px;
      font-family: 'Jost', sans-serif; font-size: 11px;
      letter-spacing: 0.1em; text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(196,127,0,0.3); white-space: nowrap;
    }

    /* ══════════════════════════════════════════
       ABOUT
    ══════════════════════════════════════════ */
    .about-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(32px,5vw,80px); align-items: start;
    }
    .about-bio {
      font-family: 'Jost', sans-serif; font-size: clamp(14px,1.3vw,16px);
      font-weight: 300; color: var(--text); line-height: 1.9;
    }
    .about-bio p + p { margin-top: 18px; }
    .about-bio strong { color: var(--g1); font-weight: 500; }

    .skills-section { }
    .skill-group { margin-bottom: 26px; }
    .skill-group-label {
      font-family: 'DM Mono', monospace; font-size: 10px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--g2); margin-bottom: 11px;
      display: flex; align-items: center; gap: 8px;
    }
    .skill-group-label::after {
      content: ''; flex: 1; height: 1px; background: rgba(245,200,66,0.22);
    }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-tag {
      font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 400;
      color: var(--mid);
      background: rgba(245,200,66,0.1);
      border: 1px solid rgba(245,200,66,0.28);
      border-radius: 999px; padding: 5px 14px;
      transition: background 0.2s, border-color 0.2s; cursor: default;
    }
    .skill-tag:hover { background: rgba(245,200,66,0.2); border-color: var(--g2); }
    /* Coming-soon tag variant */
    .skill-tag.soon {
      opacity: 0.55; font-style: italic;
      border-style: dashed;
    }

    /* ══════════════════════════════════════════
       JOURNEY / TIMELINE
    ══════════════════════════════════════════ */
    .timeline { position: relative; padding-left: 34px; }
    .timeline::before {
      content: ''; position: absolute; left: 8px; top: 6px; bottom: 0;
      width: 1.5px;
      background: linear-gradient(180deg, var(--g3) 0%, rgba(245,200,66,0.1) 100%);
    }
    .tl-item {
      position: relative; margin-bottom: clamp(30px,4.5vh,48px);
      opacity: 0; transform: translateX(-14px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .tl-item.visible { opacity: 1; transform: translateX(0); }
    .tl-dot {
      position: absolute; left: -30px; top: 5px;
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--g3); background: var(--g5);
      display: flex; align-items: center; justify-content: center;
    }
    .tl-dot-inner {
      width: 6px; height: 6px; border-radius: 50%;
      background: linear-gradient(135deg,var(--g1),var(--g2));
    }
    /* Dimmed dot for future items */
    .tl-item.future .tl-dot { border-color: rgba(245,200,66,0.3); }
    .tl-item.future .tl-dot-inner { background: rgba(196,127,0,0.3); }
    .tl-item.future .tl-heading { color: var(--mid); opacity: 0.65; }
    .tl-item.future .tl-desc { opacity: 0.5; }

    .tl-date {
      font-family: 'DM Mono', monospace; font-size: 10px;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--g2); margin-bottom: 5px;
    }
    .tl-heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(16px,1.8vw,20px); font-weight: 500;
      color: var(--dark); margin-bottom: 5px;
    }
    .tl-desc {
      font-family: 'Jost', sans-serif; font-size: 14px;
      color: var(--mid); font-weight: 300; line-height: 1.7; margin-bottom: 9px;
    }
    .tl-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: 'Jost', sans-serif; font-size: 10px;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 3px 11px; border-radius: 999px; font-weight: 500;
    }
    .badge-edu        { background: rgba(100,160,255,0.12); color: #3a66cc; border: 1px solid rgba(100,160,255,0.25); }
    .badge-work       { background: rgba(245,200,66,0.15);  color: var(--g1); border: 1px solid rgba(245,200,66,0.32); }
    .badge-achievement{ background: rgba(80,200,120,0.12);  color: #257a42; border: 1px solid rgba(80,200,120,0.25); }
    .badge-personal   { background: rgba(220,100,180,0.12); color: #992080; border: 1px solid rgba(220,100,180,0.22); }
    .badge-soon       { background: rgba(196,127,0,0.08);   color: var(--g2); border: 1px dashed rgba(196,127,0,0.3); font-style: italic; }

    /* ══════════════════════════════════════════
       HIGHLIGHTS / WORK CARDS
    ══════════════════════════════════════════ */
    .achiev-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(clamp(260px,28vw,340px),1fr));
      gap: clamp(16px,2vw,26px);
    }
    .achiev-card {
      background: rgba(255,252,240,0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245,200,66,0.22);
      border-radius: 20px; padding: clamp(22px,2.5vw,32px);
      position: relative; overflow: hidden;
      opacity: 0; transform: translateY(18px);
      transition: opacity 0.55s ease, transform 0.55s ease, box-shadow 0.25s;
    }
    .achiev-card.visible { opacity: 1; transform: translateY(0); }
    .achiev-card:hover { transform: translateY(-4px); box-shadow: 0 14px 44px rgba(196,127,0,0.11); }
    .achiev-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2.5px;
      background: linear-gradient(90deg,var(--g1),var(--g3));
    }
    /* dimmed for "coming soon" cards */
    .achiev-card.soon { opacity: 0; } /* overridden when visible */
    .achiev-card.soon.visible { opacity: 0.6; }
    .achiev-card.soon:hover { opacity: 0.85; }

    .achiev-icon { font-size: 26px; margin-bottom: 14px; }
    .achiev-year {
      font-family: 'DM Mono', monospace; font-size: 11px;
      letter-spacing: 0.15em; color: var(--g2); margin-bottom: 7px;
    }
    .achiev-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(15px,1.5vw,18px); font-weight: 500;
      color: var(--dark); margin-bottom: 9px; line-height: 1.35;
    }
    .achiev-body {
      font-family: 'Jost', sans-serif; font-size: 13px;
      color: var(--mid); font-weight: 300; line-height: 1.7;
    }
    .coming-tag {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 12px;
      font-family: 'Jost', sans-serif; font-size: 10px;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--g2); font-style: italic;
      border-top: 1px dashed rgba(245,200,66,0.35); padding-top: 10px; width: 100%;
    }
    .coming-tag::before { content: '◎'; font-style: normal; color: var(--g3); }

    /* ══════════════════════════════════════════
       GALLERY
    ══════════════════════════════════════════ */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      grid-auto-rows: 200px;
      gap: clamp(10px,1.5vw,18px);
    }
    .gallery-item {
      border-radius: 16px; overflow: hidden; position: relative;
      background: linear-gradient(160deg,rgba(245,200,66,0.1),rgba(255,228,154,0.16));
      border: 1.5px dashed rgba(245,200,66,0.32);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.22s, border-color 0.22s;
    }
    .gallery-item:hover { transform: scale(1.03); border-color: rgba(245,200,66,0.65); }
    .gallery-item:first-child { grid-column: span 2; }
    .gallery-item img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; border-radius: 16px;
    }
    .gallery-placeholder { text-align: center; color: var(--g2); }
    .gallery-placeholder span { font-size: 26px; display: block; margin-bottom: 7px; }
    .gallery-placeholder p {
      font-family: 'Jost', sans-serif; font-size: 11px;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--g1); opacity: 0.55;
    }

    /* ══════════════════════════════════════════
       CONTACT
    ══════════════════════════════════════════ */
    .contact-grid {
      display: grid; grid-template-columns: 1fr 1.45fr;
      gap: clamp(32px,5vw,80px); align-items: start;
    }
    .contact-info-panel {
      background: rgba(255,252,240,0.6);
      border: 1px solid rgba(245,200,66,0.22);
      border-radius: 22px; padding: clamp(24px,3vw,38px);
      position: relative; overflow: hidden;
    }
    .contact-info-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2.5px;
      background: linear-gradient(90deg,var(--g1),var(--g3));
    }
    .contact-info-panel::after {
      content: '☀';
      position: absolute; bottom: -18px; right: 14px;
      font-size: 80px; opacity: 0.05; pointer-events: none;
      line-height: 1;
    }
    .contact-panel-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(16px,1.8vw,22px); font-weight: 500; font-style: italic;
      color: var(--dark); margin-bottom: 6px;
    }
    .contact-panel-sub {
      font-family: 'Jost', sans-serif; font-size: 13px;
      color: var(--mid); font-weight: 300; line-height: 1.65;
      margin-bottom: clamp(22px,3vh,30px);
    }
    .contact-item {
      display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px;
    }
    .contact-item:last-of-type { margin-bottom: 0; }
    .contact-icon-box {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      background: rgba(245,200,66,0.12);
      border: 1px solid rgba(245,200,66,0.28);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .contact-item-label {
      font-family: 'DM Mono', monospace; font-size: 9px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--g2); margin-bottom: 3px;
    }
    .contact-item-value {
      font-family: 'Jost', sans-serif; font-size: 14px;
      color: var(--mid); font-weight: 300;
    }
    .contact-item-value.soon-text {
      font-style: italic; opacity: 0.55; font-size: 13px;
    }

    /* form */
    .contact-form-wrap {
      background: rgba(255,252,240,0.72);
      border: 1px solid rgba(245,200,66,0.22);
      border-radius: 22px; padding: clamp(24px,3vw,38px);
      position: relative; overflow: hidden;
    }
    .contact-form-wrap::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2.5px;
      background: linear-gradient(90deg,var(--g3),var(--g1));
    }
    .form-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(16px,1.8vw,22px); font-style: italic; font-weight: 500;
      color: var(--dark); margin-bottom: 6px;
    }
    .form-subtitle {
      font-family: 'Jost', sans-serif; font-size: 13px;
      color: var(--mid); font-weight: 300; line-height: 1.6;
      margin-bottom: clamp(20px,3vh,28px);
    }
    .contact-form { display: flex; flex-direction: column; gap: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label {
      font-family: 'Jost', sans-serif; font-size: 10px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--g1); font-weight: 500;
    }
    .form-input, .form-textarea {
      background: rgba(255,252,240,0.8);
      border: 1.5px solid rgba(245,200,66,0.28);
      border-radius: 10px; padding: 11px 15px;
      font-family: 'Jost', sans-serif; font-size: 14px;
      color: var(--text); font-weight: 300; outline: none; width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input::placeholder, .form-textarea::placeholder { color: rgba(74,48,0,0.35); }
    .form-input:focus, .form-textarea:focus {
      border-color: var(--g2);
      box-shadow: 0 0 0 3px rgba(245,200,66,0.1);
    }
    .form-textarea { min-height: 120px; resize: vertical; }
    .form-footer {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-top: 4px;
    }
    .form-note {
      font-family: 'Jost', sans-serif; font-size: 11px;
      color: var(--mid); opacity: 0.5; font-weight: 300;
    }

    /* success state */
    .form-success {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 20px; text-align: center; gap: 12px;
    }
    .form-success.show { display: flex; }
    .form-success-icon { font-size: 36px; }
    .form-success-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px; font-style: italic; color: var(--dark);
    }
    .form-success-sub {
      font-family: 'Jost', sans-serif; font-size: 13px;
      color: var(--mid); font-weight: 300;
    }

    /* ══════════════════════════════════════════
       FOOTER
    ══════════════════════════════════════════ */
    footer {
      position: relative; z-index: 1;
      border-top: 1px solid rgba(245,200,66,0.18);
    }
    .footer-inner {
      max-width: 1200px; margin: 0 auto;
      padding: clamp(28px,4vh,48px) clamp(20px,5vw,80px);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px;
    }
    .footer-name {
      font-family: 'Playfair Display', serif;
      font-size: 17px; font-style: italic; color: var(--g1); margin-bottom: 5px;
    }
    .footer-tagline {
      font-family: 'Jost', sans-serif; font-size: 12px;
      color: var(--mid); font-weight: 300; opacity: 0.65;
    }
    .footer-right {
      font-family: 'Jost', sans-serif; font-size: 11px;
      letter-spacing: 0.08em; color: var(--mid); opacity: 0.55; text-align: right;
    }

    /* ══ Scroll to top ══ */
    #scrollTop {
      position: fixed; bottom: clamp(20px,3vh,36px); right: clamp(20px,2.5vw,36px);
      z-index: 50; width: 46px; height: 46px; border-radius: 50%;
      background: linear-gradient(135deg,var(--g1),var(--g2));
      border: none; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(196,127,0,0.32);
      color: white; font-size: 18px;
      transition: transform 0.2s;
    }
    #scrollTop:hover { transform: translateY(-3px); }
    #scrollTop.visible { display: flex; }

    /* ══════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════ */
    @media (max-width: 900px) {
      .hero-inner { grid-template-columns: 1fr; }
      .hero-photo-wrap { display: none; }
      .about-grid { grid-template-columns: 1fr; }
      .contact-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .gallery-grid { grid-template-columns: repeat(2,1fr); }
      .gallery-item:first-child { grid-column: span 2; }
      .form-row { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .nav-ham { display: flex; }
      .achiev-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) {
      .gallery-grid { grid-template-columns: 1fr; }
      .gallery-item:first-child { grid-column: span 1; }
      .hero-btns { flex-direction: column; }
    }
    /* ══════════════════════════════════════════
       GREETING OVERLAY
    ══════════════════════════════════════════ */
    #greeting-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: #1A1000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #greeting-overlay.hidden { display: none; }

    .greeting-word {
      position: absolute;
      font-family: 'Playfair Display', serif;
      font-size: clamp(52px, 12vw, 130px);
      font-style: italic; font-weight: 400;
      background: linear-gradient(160deg, #C47F00 0%, #F5C842 50%, #E8A020 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      user-select: none;
    }

    /* Subtle particle dots in overlay */
    .greeting-dot {
      position: absolute; border-radius: 50%;
      background: rgba(245, 200, 66, 0.15);
      pointer-events: none;
    }

    /* Language label */
    .greeting-lang {
      position: absolute;
      bottom: clamp(28px, 5vh, 48px);
      left: 50%; transform: translateX(-50%);
      font-family: 'DM Mono', monospace;
      font-size: clamp(10px, 1.2vw, 12px);
      letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(245, 200, 66, 0.4);
      opacity: 0;
      white-space: nowrap;
    }

    /* Progress bar at bottom */
    .greeting-progress {
      position: absolute; bottom: 0; left: 0;
      height: 2px;
      background: linear-gradient(90deg, #C47F00, #F5C842);
      width: 0%;
      transform-origin: left;
    }

    /* ══ Hide all GSAP targets initially ══ */
    .gsap-hero > * { opacity: 0; }
    .gsap-sec-label { opacity: 0; }
    .gsap-sec-title { opacity: 0; }
    .gsap-sec-sub   { opacity: 0; }

          </div>
        </div>
        <div class="gallery-item">
          <div class="gallery-placeholder">
            <span>🎓</span>
            <p>Academic life</p>
          </div>
        </div>
        <div class="gallery-item">
          <div class="gallery-placeholder">
            <span>🌍</span>
            <p>Research journey</p>
          </div>
        </div>
        <div class="gallery-item">
          <div class="gallery-placeholder">
            <span>☀️</span>
            <p>Personal moments</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="full-divider"></div>

  <!-- ══════════════════ CONTACT ══════════════════ -->
  <section id="contact">
    <div class="section-wrap">
      <div class="sec-label fade-in">Say Hello</div>
      <h2 class="sec-title fade-in">Get in <em>Touch</em></h2>
      <p class="sec-sub fade-in">
        Contact details and academic networking links are being set up. In the
        meantime, feel free to leave a message below — it will be received with care.
      </p>

      <div class="contact-grid">

        <!-- Left: Info panel -->
        <div class="contact-info-panel fade-in">
          <div class="contact-panel-title">Reach out directly</div>
          <div class="contact-panel-sub">
            Full contact information will be available here soon. Academic collaborations,
            research inquiries, and general messages are all welcome.
          </div>

          <div class="contact-item">
            <div class="contact-icon-box">✉️</div>
            <div>
              <div class="contact-item-label">Email</div>
              <div class="contact-item-value soon-text" id="contact-email">Being set up — check back soon</div>
            </div>
          </div>

          <div class="contact-item">
            <div class="contact-icon-box">📍</div>
            <div>
              <div class="contact-item-label">Location</div>
              <div class="contact-item-value" id="contact-location">India</div>
            </div>
          </div>

          <div class="contact-item">
            <div class="contact-icon-box">💼</div>
            <div>
              <div class="contact-item-label">LinkedIn</div>
              <div class="contact-item-value soon-text" id="contact-linkedin">Profile link coming soon</div>
            </div>
          </div>

          <div class="contact-item">
            <div class="contact-icon-box">⏱️</div>
            <div>
              <div class="contact-item-label">Response time</div>
              <div class="contact-item-value" id="contact-response">Within 24–48 hours</div>
            </div>
          </div>
        </div>

        <!-- Right: Form -->
        <div class="contact-form-wrap fade-in">
          <div id="formContent">
            <div class="form-title">Leave a message</div>
            <div class="form-subtitle">
              Drop a note and it will be personally read and replied to. No form
              goes unanswered here.
            </div>
            <form class="contact-form" id="contactForm" onsubmit="handleForm(event)" novalidate>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="fname">Your Name</label>
                  <input id="fname" type="text" class="form-input" placeholder="Full name" required/>
                </div>
                <div class="form-group">
                  <label class="form-label" for="femail">Your Email</label>
                  <input id="femail" type="email" class="form-input" placeholder="email@example.com" required/>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="fsubject">Subject</label>
                <input id="fsubject" type="text" class="form-input" placeholder="What is this about?" required/>
              </div>
              <div class="form-group">
                <label class="form-label" for="fmessage">Message</label>
                <textarea id="fmessage" class="form-textarea" placeholder="Write your message here…" required></textarea>
              </div>
              <div class="form-footer">
                <span class="form-note">Your message goes directly to Mansi.</span>
                <button type="submit" class="btn-primary" id="submitBtn">✦ &nbsp;Send Message</button>
              </div>
            </form>
          </div>

          <!-- Success state — hidden until form submitted -->
          <div class="form-success" id="formSuccess">
            <div class="form-success-icon">☀️</div>
            <div class="form-success-title">Message received!</div>
            <div class="form-success-sub">Thank you for reaching out. A reply will be on its way soon.</div>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>

<!-- ══════════════════ FOOTER ══════════════════ -->
<footer>
  <div class="footer-inner">
    <div>
      <div class="footer-name">Mansi Pundir</div>
      <div class="footer-tagline">Building knowledge, documenting growth, contributing one step at a time.</div>
    </div>
    <div class="footer-right">
      © <span id="footer-year"></span> Mansi Pundir · All rights reserved<br/>
      <span style="font-size:10px; opacity:0.6;">mansipundir.com</span>
    </div>
  </div>
</footer>

<button id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
  const API = 'https://mansipundir-api.risingbeatzz.workers.dev';

  /* ── Auto year ── */
  document.getElementById('footer-year').textContent = new Date().getFullYear();

  /* ══════════════════════════════════════════
     GREETING ANIMATION
  ══════════════════════════════════════════ */
  gsap.registerPlugin(ScrollTrigger);

  const greetings = [
    { word: 'Hello',          lang: 'English'    },
    { word: 'नमस्ते',          lang: 'Hindi'      },
    { word: 'Hola',           lang: 'Spanish'    },
    { word: 'Bonjour',        lang: 'French'     },
    { word: 'Ciao',           lang: 'Italian'    },
    { word: 'Olá',            lang: 'Portuguese' },
    { word: 'Merhaba',        lang: 'Turkish'    },
    { word: 'Hej',            lang: 'Swedish'    },
    { word: 'Hallo',          lang: 'German'     },
    { word: 'こんにちは',       lang: 'Japanese'   },
    { word: 'ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ',    lang: 'Punjabi'    },
  ];

  const overlay  = document.getElementById('greeting-overlay');
  const langEl   = document.getElementById('greeting-lang');
  const progress = document.getElementById('greeting-progress');
  const words    = greetings.map((_, i) => document.getElementById('gw-' + i));

  const HOLD     = 0.38; // seconds each word stays
  const IN_DUR   = 0.28;
  const OUT_DUR  = 0.22;
  const tl       = gsap.timeline({ delay: 0.1 });

  /* Animate decorative dots slowly */
  gsap.to('.greeting-dot', {
    scale: 1.15, duration: 3, ease: 'sine.inOut',
    stagger: 0.8, yoyo: true, repeat: -1
  });

  /* Progress bar across full duration */
  const totalDur = greetings.length * (IN_DUR + HOLD + OUT_DUR);
  gsap.to(progress, { width: '100%', duration: totalDur, ease: 'none', delay: 0.1 });

  /* Cycle through each greeting */
  greetings.forEach((g, i) => {
    const el = words[i];

    /* Slide in from below */
    tl.set(el, { y: 55, opacity: 0 })
      .to(el, {
        y: 0, opacity: 1,
        duration: IN_DUR,
        ease: 'power3.out'
      })
      /* Update lang label */
      .call(() => {
        gsap.to(langEl, { opacity: 0, duration: 0.1, onComplete: () => {
          langEl.textContent = g.lang;
          gsap.to(langEl, { opacity: 1, duration: 0.2 });
        }});
      })
      /* Hold */
      .to(el, { duration: HOLD })
      /* Slide out upward */
      .to(el, {
        y: -55, opacity: 0,
        duration: OUT_DUR,
        ease: 'power2.in'
      });
  });

  /* Slide overlay up — reveal site */
  tl.to(overlay, {
    yPercent: -100,
    duration: 0.9,
    ease: 'power4.inOut',
    onComplete: () => {
      overlay.classList.add('hidden');
      /* Trigger hero entrance after overlay gone */
      animateHeroEntrance();
    }
  });

  /* ══════════════════════════════════════════
     HERO ENTRANCE (runs after overlay exits)
  ══════════════════════════════════════════ */
  function animateHeroEntrance() {
    const heroChildren = document.querySelectorAll('.gsap-hero > *');
    const photoWrap    = document.querySelector('.hero-photo-wrap');

    gsap.fromTo(heroChildren,
      { y: 30, opacity: 0 },
      {
        y: 0, opacity: 1,
        duration: 0.7,
        ease: 'power3.out',
        stagger: 0.1,
        clearProps: 'transform'
      }
    );

    if (photoWrap) {
      gsap.fromTo(photoWrap,
        { x: 40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.9, ease: 'power3.out', delay: 0.3 }
      );
    }
  }

  /* ══════════════════════════════════════════
     SCROLL ANIMATIONS
  ══════════════════════════════════════════ */
  function initScrollAnimations() {

    /* ── Section labels + titles ── */
    gsap.utils.toArray('.sec-label').forEach(el => {
      gsap.fromTo(el,
        { x: -20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.6, ease: 'power2.out',
          scrollTrigger: { trigger: el, start: 'top 88%', toggleActions: 'play none none none' }
        }
      );
    });

    gsap.utils.toArray('.sec-title').forEach(el => {
      gsap.fromTo(el,
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: 'power3.out',
          scrollTrigger: { trigger: el, start: 'top 86%', toggleActions: 'play none none none' }
        }
      );
    });

    gsap.utils.toArray('.sec-sub').forEach(el => {
      gsap.fromTo(el,
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: 'power2.out',
          scrollTrigger: { trigger: el, start: 'top 88%', toggleActions: 'play none none none' }
        }
      );
    });

    /* ── About bio ── */
    const bioParagraphs = document.querySelectorAll('.about-bio p');
    gsap.fromTo(bioParagraphs,
      { y: 22, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.65, ease: 'power2.out', stagger: 0.15,
        scrollTrigger: { trigger: '.about-bio', start: 'top 84%', toggleActions: 'play none none none' }
      }
    );

    /* ── Skill tags stagger ── */
    gsap.utils.toArray('.skill-group').forEach(group => {
      const tags = group.querySelectorAll('.skill-tag');
      gsap.fromTo(tags,
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(1.5)', stagger: 0.06,
          scrollTrigger: { trigger: group, start: 'top 88%', toggleActions: 'play none none none' }
        }
      );
    });

    /* ── Timeline items ── */
    function animateTlItems() {
      gsap.utils.toArray('.tl-item').forEach((item, i) => {
        gsap.fromTo(item,
          { x: -30, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.65, ease: 'power2.out', delay: i * 0.08,
            scrollTrigger: { trigger: item, start: 'top 88%', toggleActions: 'play none none none' }
          }
        );
      });
    }
    animateTlItems();

    /* ── Achievement cards ── */
    function animateAchievCards() {
      gsap.utils.toArray('.achiev-card').forEach((card, i) => {
        gsap.fromTo(card,
          { y: 35, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out', delay: i * 0.07,
            scrollTrigger: { trigger: card, start: 'top 90%', toggleActions: 'play none none none' }
          }
        );
      });
    }
    animateAchievCards();

    /* ── Gallery items ── */
    function animateGalleryItems() {
      gsap.utils.toArray('.gallery-item').forEach((item, i) => {
        gsap.fromTo(item,
          { scale: 0.92, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.55, ease: 'power2.out', delay: i * 0.08,
            scrollTrigger: { trigger: item, start: 'top 92%', toggleActions: 'play none none none' }
          }
        );
      });
    }
    animateGalleryItems();

    /* ── Contact panels ── */
    gsap.utils.toArray('.contact-info-panel, .contact-form-wrap').forEach((el, i) => {
      gsap.fromTo(el,
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: 'power2.out', delay: i * 0.12,
          scrollTrigger: { trigger: el, start: 'top 86%', toggleActions: 'play none none none' }
        }
      );
    });

    /* ── Full dividers ── */
    gsap.utils.toArray('.full-divider').forEach(el => {
      gsap.fromTo(el,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.8, ease: 'power2.out', transformOrigin: 'center',
          scrollTrigger: { trigger: el, start: 'top 90%', toggleActions: 'play none none none' }
        }
      );
    });

    /* ── Re-observe new dynamic items from API ── */
    window._refreshGSAP = () => {
      animateTlItems();
      animateAchievCards();
      animateGalleryItems();
      ScrollTrigger.refresh();
    };
  }

  /* Init scroll animations immediately — they wait for scroll anyway */
  initScrollAnimations();

  /* ── Hamburger ── */
  const hamBtn  = document.getElementById('hamBtn');
  const mobMenu = document.getElementById('mobileMenu');
  hamBtn.addEventListener('click', () => {
    hamBtn.classList.toggle('open');
    mobMenu.classList.toggle('open');
  });
  function closeMobile() {
    hamBtn.classList.remove('open');
    mobMenu.classList.remove('open');
  }

  /* ── Active nav on scroll ── */
  const allSections = document.querySelectorAll('section[id]');
  const navAs       = document.querySelectorAll('.nav-links a, .mobile-menu a');
  function updateNav() {
    let current = 'home';
    allSections.forEach(s => {
      if (window.scrollY >= s.offsetTop - 90) current = s.id;
    });
    navAs.forEach(a => {
      const isActive = a.getAttribute('href') === '#' + current;
      a.classList.toggle('active', isActive);
    });
    document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 380);
  }
  window.addEventListener('scroll', updateNav, { passive: true });
  updateNav();

  /* ── Contact form ── */
  function handleForm(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.textContent = 'Sending…';
    btn.disabled = true;
    const name    = document.getElementById('fname').value;
    const email   = document.getElementById('femail').value;
    const subject = document.getElementById('fsubject').value;
    const message = document.getElementById('fmessage').value;
    fetch(`${API}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, subject, message })
    }).finally(() => {
      document.getElementById('formContent').style.display = 'none';
      document.getElementById('formSuccess').classList.add('show');
    });
  }

  /* ════════════════════════════════
     LIVE DATA FROM API
  ════════════════════════════════ */
  function setText(id, value, removeSoonClass) {
    const el = document.getElementById(id);
    if (el && value) {
      el.textContent = value;
      if (removeSoonClass) el.classList.remove('soon-text');
    }
  }

  function setSkillTags(containerId, csv) {
    if (!csv || !csv.trim()) return;
    const container = document.getElementById(containerId);
    if (!container) return;
    const tags = csv.split(',').map(s => s.trim()).filter(Boolean);
    container.innerHTML = tags.map(t =>
      `<span class="skill-tag">${t}</span>`
    ).join('');
  }

  /* ── Profile + Content ── */
  fetch(`${API}/content`)
    .then(r => r.json())
    .then(d => {
      if (d.name) {
        const parts = d.name.trim().split(' ');
        const last  = parts.pop();
        const first = parts.join(' ') || last;
        document.getElementById('hero-name').innerHTML = `${first}<br/><em>${last}</em>`;
        setText('hero-badge-name', d.name);
        const logo = document.querySelector('.nav-logo');
        if (logo) logo.lastChild.textContent = ' ' + d.name;
        const fn = document.querySelector('.footer-name');
        if (fn) fn.textContent = d.name;
      }
      setText('hero-role',        d.role);
      setText('hero-status-text', d.status);
      setText('hero-desc',        d.description);
      setText('hero-location',    d.location);
      const email = d.contact_email || d.email;
      if (email) {
        setText('hero-email', email, true);
        const mailLink = document.getElementById('social-email');
        if (mailLink) mailLink.href = 'mailto:' + email;
      }
      if (d.photo) {
        const wrap = document.getElementById('hero-photo-wrap');
        if (wrap) {
          wrap.style.background = 'none';
          wrap.style.border     = 'none';
          wrap.innerHTML = `<img src="${d.photo}" alt="${d.name||'Mansi Pundir'}"
            style="width:100%;height:100%;object-fit:cover;border-radius:22px;"/>`;
        }
      }
      if (d.instagram) { const el = document.getElementById('social-instagram'); if (el) el.href = d.instagram; }
      if (d.linkedin)  { const el = document.getElementById('social-linkedin');  if (el) el.href = d.linkedin; setText('contact-linkedin', d.linkedin, true); }
      if (d.twitter)   { const el = document.getElementById('social-twitter');   if (el) el.href = d.twitter; }
      if (d.bio1 || d.bio2) {
        const bio = document.getElementById('about-bio');
        if (bio) bio.innerHTML = [d.bio1, d.bio2].filter(Boolean).map(p => `<p>${p}</p>`).join('');
      }
      setSkillTags('skills-interests', d.interests);
      setSkillTags('skills-expertise', d.skills);
      setSkillTags('skills-languages', d.languages);
      setSkillTags('skills-tools',     d.tools);
      if (d.contact_email)    setText('contact-email',    d.contact_email, true);
      setText('contact-location', d.contact_location || d.location);
      setText('contact-response', d.contact_response);
    })
    .catch(() => {});

  /* ── Timeline ── */
  fetch(`${API}/timeline`)
    .then(r => r.json())
    .then(items => {
      if (!items || !items.length) return;
      const badgeMap = { edu:'badge-edu', work:'badge-work', achievement:'badge-achievement', personal:'badge-personal', soon:'badge-soon' };
      const labelMap = { edu:'Education', work:'Research', achievement:'Achievement', personal:'Personal' };
      const container = document.getElementById('timeline-container');
      container.innerHTML = items.map(i => `
        <div class="tl-item">
          <div class="tl-dot"><div class="tl-dot-inner"></div></div>
          <div class="tl-date">${i.date_label||''}</div>
          <div class="tl-heading">${i.title}</div>
          <div class="tl-desc">${i.description||''}</div>
          <span class="tl-badge ${badgeMap[i.badge_type]||'badge-work'}">● ${labelMap[i.badge_type]||'Milestone'}</span>
        </div>`).join('');
      if (window._refreshGSAP) window._refreshGSAP();
    })
    .catch(() => {});

  /* ── Achievements ── */
  fetch(`${API}/achievements`)
    .then(r => r.json())
    .then(items => {
      if (!items || !items.length) return;
      const container = document.getElementById('achiev-container');
      container.innerHTML = items.map(i => `
        <div class="achiev-card">
          <div class="achiev-icon">${i.icon||'✨'}</div>
          <div class="achiev-year">${i.year_label||''}</div>
          <div class="achiev-title">${i.title}</div>
          <div class="achiev-body">${i.body||''}</div>
        </div>`).join('');
      if (window._refreshGSAP) window._refreshGSAP();
    })
    .catch(() => {});

  /* ── Gallery ── */
  fetch(`${API}/gallery`)
    .then(r => r.json())
    .then(items => {
      if (!items || !items.length) return;
      const container = document.getElementById('gallery-container');
      container.innerHTML = items.map((i, idx) => `
        <div class="gallery-item${idx===0?' first':''}">
          <img src="${i.image_url}" alt="${i.caption||'Gallery photo'}"
               onerror="this.parentElement.innerHTML='<div class=gallery-placeholder><span>🖼️</span><p>${i.caption||''}</p></div>'"/>
        </div>`).join('');
      if (window._refreshGSAP) window._refreshGSAP();
    })
    .catch(() => {});
</script>

</body>
</html>
