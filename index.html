<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mansi Pundir</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#020617);
    color:white;
    font-family:Georgia, serif;
    overflow:hidden;
}

.container{
    max-width:800px;
    text-align:center;
    padding:30px;
    animation:fadeIn 2s ease;
}

h1{
    font-size:4rem;
    margin-bottom:20px;
}

p{
    font-size:1.4rem;
    line-height:1.8;
    opacity:0.9;
}

.domain{
    margin-top:25px;
    font-size:1.8rem;
    font-weight:bold;
}

.footer{
    margin-top:40px;
    opacity:0.6;
    font-size:1rem;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Hi, Mansi.</h1>

    <p>
        Out of billions of people and billions of websites,
        there is one address on the internet that carries your name.
    </p>

    <div class="domain">
        mansipundir.com
    </div>

    <p style="margin-top:25px;">
        This little corner of the internet belongs to you.
    </p>

    <div class="footer">
        Reserved with care.
    </div>
</div>

</body>
</html>
